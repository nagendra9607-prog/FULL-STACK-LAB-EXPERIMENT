<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Register Page -->
<div class="login-box" id="registerPage">

    <h2>Create Account</h2>

    <input type="text" id="regUser" placeholder="Create Username">

    <input type="password" id="regPass" placeholder="Create Password">

    <input type="password" id="regConfirm" placeholder="Confirm Password">

    <button onclick="register()">Register</button>

    <p class="link">
        Already have an account?
        <a href="#" onclick="showLogin()">Login</a>
    </p>

</div>

<!-- Login Page -->

<div class="login-box" id="loginPage">

    <h2>Login</h2>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p class="link">
        New User?
        <a href="#" onclick="showRegister()">Create Account</a>
    </p>

</div>

<!-- Todo Page -->

<div class="todo-box" id="todoPage">

    <h2>📝 My To-Do List</h2>

    <input type="text" id="taskInput" placeholder="Enter Task">

    <button onclick="addTask()">Add Task</button>

    <h3>Total Tasks : <span id="count">0</span></h3>

    <ul id="taskList"></ul>

    <button class="logout-btn" onclick="logout()">Logout</button>

</div>

<script src="script.js"></script>

</body>
</html>
