<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <h2>TaskFlow</h2>
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Projects</a>
        <a href="#">Tasks</a>
        <a href="#">Profile</a>
    </nav>
</header>

<section class="hero">
    <h1>Project Management Dashboard</h1>
    <p>Manage your projects and tasks efficiently.</p>
</section>

<section class="dashboard">

    <div class="card">
        <h3>Total Tasks</h3>
        <h2 id="totalTasks">0</h2>
    </div>

    <div class="card">
        <h3>Pending</h3>
        <h2 id="pendingTasks">0</h2>
    </div>

    <div class="card">
        <h3>In Progress</h3>
        <h2 id="progressTasks">0</h2>
    </div>

    <div class="card">
        <h3>Completed</h3>
        <h2 id="completedTasks">0</h2>
    </div>

</section>

<section class="task-form">

    <h2>Add New Task</h2>

    <form id="taskForm">

        <input type="text" id="taskName" placeholder="Task Name" required>

        <textarea id="taskDesc" placeholder="Task Description" required></textarea>

        <select id="priority" required>
            <option value="">Select Priority</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>

        <input type="date" id="dueDate" required>

        <button type="submit">Add Task</button>

    </form>

</section>

<section class="task-list">

    <h2>Task List</h2>

    <div id="tasks">

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
