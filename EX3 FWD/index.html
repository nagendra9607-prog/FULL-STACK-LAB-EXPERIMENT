<!DOCTYPE html>
<html>

<head>

<title>Mini Twitter</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<!-- Profile Section -->

<div class="profile">


<div class="profile-img">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

</div>


<div class="profile-info">

<h2>🐦 Mini Twitter</h2>

<h3>Nagendra <span>✔</span></h3>

<p>@nagendra_dev</p>


<p>
Followers:
<b id="followers">250</b>
</p>


<button id="followBtn">
Follow
</button>


</div>


<button id="themeBtn" class="theme">
🌙
</button>


</div>




<!-- Search -->

<div class="search-box">

<input id="searchInput" 
placeholder="🔍 Search posts...">

</div>





<!-- Create Post -->


<div class="post-box">


<textarea 
id="postInput"
placeholder="What's happening?">
</textarea>



<div class="post-options">


<input type="file" id="imageInput">


<button id="postBtn">
Post
</button>


</div>


</div>





<!-- Feed -->


<div id="feed"></div>




</div>



<script src="script.js"></script>


</body>


</html>
